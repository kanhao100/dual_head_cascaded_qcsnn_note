<svg class="dg" viewBox="0 0 940 330" role="img"><title>卷积循环结构</title><defs><marker id="f2A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mk " d="M2 1L8 5L2 9"/></marker><marker id="f2C" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mk mkc" d="M2 1L8 5L2 9"/></marker><marker id="f2G" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mk mkg" d="M2 1L8 5L2 9"/></marker></defs><text class="tm" x="20" y="22" text-anchor="start">卷积 2 的计算循环（16→16 通道，核 3，输出 87 点 × 16 通道 = 1392 次迭代，II=1，流水线深度 27）</text><rect class="bx mem" x="20" y="40" width="160" height="76" rx="7"/><text class="t" x="100.0" y="58.0" text-anchor="middle">input_buffer</text><text class="ts" x="100.0" y="74.0" text-anchor="middle">16 通道 × 3 分块 = 48 块</text><text class="ts" x="100.0" y="90.0" text-anchor="middle">每块 30 × 8 位</text><text class="ts" x="100.0" y="106.0" text-anchor="middle">BRAM 0（寄存器/分布式）</text><path class="ln " d="M180 78 L196 78" marker-end="url(#f2A)"/><rect class="bx cmp" x="196" y="40" width="150" height="76" rx="7"/><text class="t" x="271.0" y="66.0" text-anchor="middle">地址计算  S2–S12</text><text class="ts" x="271.0" y="82.0" text-anchor="middle">t mod 3：取模，11 周期</text><text class="ts" x="271.0" y="98.0" text-anchor="middle">t / 3：乘 171 再取高位</text><path class="ln " d="M346 78 L372 78" marker-end="url(#f2A)"/><rect class="bx cmp" x="372" y="40" width="130" height="76" rx="7"/><text class="t" x="437.0" y="66.0" text-anchor="middle">读取  S12–S13</text><text class="ts" x="437.0" y="82.0" text-anchor="middle">144 次 load</text><text class="ts" x="437.0" y="98.0" text-anchor="middle">= 48 抽头 × 3 块</text><path class="ln " d="M502 78 L528 78" marker-end="url(#f2A)"/><rect class="bx cmp" x="528" y="40" width="120" height="76" rx="7"/><text class="t" x="588.0" y="66.0" text-anchor="middle">分块选择  S13</text><text class="ts" x="588.0" y="82.0" text-anchor="middle">63 个 sparsemux</text><text class="ts" x="588.0" y="98.0" text-anchor="middle">按 t mod 3 挑结果</text><path class="ln " d="M648 78 L674 78" marker-end="url(#f2A)"/><rect class="bx cmp" x="674" y="40" width="120" height="76" rx="7"/><text class="t" x="734.0" y="66.0" text-anchor="middle">乘法  S13–S24</text><text class="ts" x="734.0" y="82.0" text-anchor="middle">110 个 mul 操作</text><text class="ts" x="734.0" y="98.0" text-anchor="middle">HLS：31 DSP</text><path class="ln " d="M794 78 L820 78" marker-end="url(#f2A)"/><rect class="bx cmp" x="820" y="40" width="100" height="76" rx="7"/><text class="t" x="870.0" y="66.0" text-anchor="middle">加法树</text><text class="t" x="870.0" y="82.0" text-anchor="middle">S15–S22</text><text class="ts" x="870.0" y="98.0" text-anchor="middle">77 个 add</text><path class="ln " d="M870 116 L870 150 L760 150" marker-end="url(#f2A)"/><rect class="bx mem" x="20" y="150" width="130" height="70" rx="7"/><text class="t" x="85.0" y="173.0" text-anchor="middle">权重常量表</text><text class="ts" x="85.0" y="189.0" text-anchor="middle">weights[oc][ic][k]</text><text class="ts" x="85.0" y="205.0" text-anchor="middle">oc、ic 完全分块</text><path class="ln  dsh" d="M150 185 L676 185" marker-end="url(#f2A)"/><text class="ts" x="410" y="178" text-anchor="middle">oc 由计数器选通，同一拍取 48 个权重</text><rect class="bx cmp" x="580" y="150" width="180" height="70" rx="7"/><text class="t" x="670.0" y="173.0" text-anchor="middle">重量化  S23–S27</text><text class="ts" x="670.0" y="189.0" text-anchor="middle">× 乘数 → + 舍入 → 右移</text><text class="ts" x="670.0" y="205.0" text-anchor="middle">→ 饱和到 INT8 → 写 FIFO</text><rect class="bx io" x="780" y="150" width="140" height="70" rx="7"/><text class="t" x="850.0" y="181.0" text-anchor="middle">输出 FIFO</text><text class="ts" x="850.0" y="197.0" text-anchor="middle">INT8 流</text><path class="ln " d="M760 185 L780 185" marker-end="url(#f2A)"/><rect class="bx io" x="20" y="250" width="900" height="60" rx="7"/><text class="t" x="470.0" y="268.0" text-anchor="middle">为什么能做到 II=1（依据：调度报告 + 存储器表）</text><text class="ts" x="470.0" y="284.0" text-anchor="middle">每拍需要同一通道的 t、t+1、t+2 三个点：工具把 input_buffer 按时间再分成 3 块（t mod 3），三个点分属三块，同拍各读一块。</text><text class="ts" x="470.0" y="300.0" text-anchor="middle">代价是前 12 级几乎都花在地址计算上，流水线变深（27 级），但每拍仍可启动一个新迭代。</text></svg>
