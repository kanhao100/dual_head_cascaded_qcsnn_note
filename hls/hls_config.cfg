# Vitis HLS 2026.1 (unified flow) config for the dual-head QCSNN IP.
# Option names were checked against E:\Xilinx\2026.1\Vitis\...\hls_options.json.
# Paper setup: Zynq-7020 (PYNQ-Z2), 100 MHz, top function = topFunction, Vivado IP catalog output.
# No testbench on purpose: C simulation / co-simulation are skipped.
# Run with hls\run_csynth.bat (C synthesis only).

part=xc7z020clg400-1

[hls]
clock=10ns
syn.top=topFunction
syn.file=E:/0Project/dual_head_cascaded_qcsnn/csnn_cpp/include/hls4csnn1d_sd/model24/cblk_sd/topclass24_sd.cpp
# constants24_sd.h includes <nlohmann/json.hpp> and <any> (host-side helpers), hence the json include dir and C++17.
# -include skip_host_reader.h pre-defines the include guard of the host-only filereader24.h so it is skipped.
# The two -D switches stop nlohmann from pulling in <filesystem>, which the bundled MinGW 8.3 headers
# cannot get through the HLS front end (smoke test failed in fs_path.h without them, passed with them).
syn.file_cflags=E:/0Project/dual_head_cascaded_qcsnn/csnn_cpp/include/hls4csnn1d_sd/model24/cblk_sd/topclass24_sd.cpp,-std=c++17 -include E:/0Project/dual_head_cascaded_qcsnn/hls/shim/skip_host_reader.h -DJSON_HAS_FILESYSTEM=0 -DJSON_HAS_EXPERIMENTAL_FILESYSTEM=0 -IE:/0Project/dual_head_cascaded_qcsnn/csnn_cpp/external/json/include
package.output.format=ip_catalog
package.output.file=E:/0Project/dual_head_cascaded_qcsnn/hls/qcsnn_topFunction_ip.zip
package.output.syn=false
